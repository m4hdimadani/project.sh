<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کرکره سوال و جواب</title>
    <style>
        /* استایل‌های اصلی */
        body {
            font-family: 'Tahoma', sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        /* کانتینر اصلی کرکره */
        .accordion {
            max-width: 700px;
            margin: 30px auto;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            overflow: hidden; /* برای اینکه لبه‌ها گرد بمونن */
        }

        /* هر آیتم سوال و جواب */
        .accordion-item {
            border-bottom: 1px solid #eee;
        }
        .accordion-item:last-child {
            border-bottom: none;
        }

        /* دکمه سوال */
        .accordion-button {
            background-color: #f7f7f7;
            color: #333;
            cursor: pointer;
            padding: 15px 20px;
            width: 100%;
            text-align: right;
            border: none;
            outline: none;
            font-size: 16px;
            transition: background-color 0.3s ease;
            position: relative; /* برای قرار دادن آیکون */
        }

        /* آیکون + / - */
        .accordion-button::after {
            content: '+'; /* آیکون پیش‌فرض */
            font-size: 20px;
            color: #777;
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            transition: transform 0.3s ease; /* برای انیمیشن */
        }

        /* وقتی دکمه فعال است */
        .accordion-button.active::after {
            content: '−'; /* آیکون منفی */
            transform: translateY(-50%) scale(1.2); /* کمی بزرگتر */
        }

        /* رنگ پس‌زمینه موقع هاور */
        .accordion-button:hover {
            background-color: #e9e9e9;
        }

        /* پنل جواب */
        .accordion-content {
            background-color: white;
            max-height: 0; /* اول مخفی */
            overflow: hidden;
            transition: max-height 0.3s ease-out; /* انیمیشن باز و بسته شدن */
            padding: 0 20px; /* فقط padding عمودی */
            box-sizing: border-box; /* برای اینکه padding محاسبه بشه */
        }

        /* وقتی آیتم فعال است، جواب نمایش داده شود */
        .accordion-item.active .accordion-content {
            max-height: 200px; /* یک مقدار کافی در نظر بگیر، یا از JS برای تنظیم دقیق استفاده کن */
            padding: 15px 20px; /* padding موقع نمایش */
            border-top: 1px solid #eee; /* خط جداکننده */
        }

        /* استایل برای متن داخل جواب */
        .accordion-content p {
            margin: 0;
            line-height: 1.6;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="accordion">
        <div class="accordion-item">
            <button class="accordion-button">سوال اول من چیست؟</button>
            <div class="accordion-content">
                <p>این جواب سوال اول است. اینجا می‌توانید توضیحات بیشتری را بنویسید.</p>
            </div>
        </div>

        <div class="accordion-item">
            <button class="accordion-button">سوال دوم پیچیده‌تر</button>
            <div class="accordion-content">
                <p>این هم جواب سوال دوم. هر متنی که لازم باشد اینجا قرار می‌گیرد.</p>
                <p>می‌توانید پاراگراف‌های بیشتری هم داشته باشید.</p>
            </div>
        </div>

        <div class="accordion-item">
            <button class="accordion-button">سوال سوم و آخر</button>
            <div class="accordion-content">
                <p>و این هم جواب سوال سوم. تمام شد!</p>
            </div>
        </div>
    </div>

    <script>
        // انتخاب تمام دکمه‌های سوال
        var accButtons = document.querySelectorAll(".accordion-button");

        accButtons.forEach(button => {
            button.addEventListener("click", function() {
                // این خط باعث میشه وقتی روی سوالی کلیک میشه، اگر آیتم دیگری باز بود بسته بشه
                // اگر این خط را حذف کنی، چند تا جواب همزمان باز می‌مونند
                // closeAllOthers(this);

                // کلاس active را به والد (accordion-item) اضافه/حذف کن
                this.parentElement.classList.toggle("active");

                // تنظیم max-height با جاوااسکریپت برای انیمیشن دقیق‌تر
                var content = this.nextElementSibling; // عنصر بعدی (accordion-content)
                if (this.parentElement.classList.contains("active")) {
                    // اگر فعال شد، max-height را برابر با ارتفاع محتوا قرار بده
                    content.style.maxHeight = content.scrollHeight + "px";
                } else {
                    // اگر غیرفعال شد، max-height را صفر کن
                    content.style.maxHeight = null;
                }
            });
        });

        // تابعی برای بستن بقیه آیتم‌ها (اختیاری)
        // function closeAllOthers(exceptThisButton) {
        //     accButtons.forEach(button => {
        //         if (button !== exceptThisButton) {
        //             button.parentElement.classList.remove("active");
        //             var content = button.nextElementSibling;
        //             content.style.maxHeight = null;
        //         }
        //     });
        // }
    </script>

</body>
</html>
